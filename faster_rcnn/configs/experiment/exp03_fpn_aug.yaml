# Thí nghiệm 3: FPN + Anchor nhỏ + Augmentation → tăng generalization

_name: "exp03_fpn_aug"
_description: "FPN + Small Anchors (8-128px) + Basic Augmentation (flip+color)"

paths:        local
data:         dataset_v1
augmentation: basic   # Flip + Brightness/Contrast
trainer:      gpu_fp32

model:
  architecture: "fasterrcnn_resnet50_fpn"
  pretrained_weights: "COCO_V1"
  backbone:
    trainable_layers: 3
  rpn:
    anchor_sizes:  [[8], [16], [32], [64], [128]]
    aspect_ratios: [[0.5, 1.0, 2.0], [0.5, 1.0, 2.0], [0.5, 1.0, 2.0],
                    [0.5, 1.0, 2.0], [0.5, 1.0, 2.0]]
  transform:
    min_size: 800
    max_size: 1333

output:
  checkpoint_name: "fasterrcnn_fpn_aug"
  pred_json:       "predictions_val_exp03_fpn_aug.json"

wandb:
  run_name: "exp03-fpn-aug"

