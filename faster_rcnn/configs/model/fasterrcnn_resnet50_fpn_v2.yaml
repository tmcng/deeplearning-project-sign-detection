# configs/model/fasterrcnn_resnet50_fpn_v2.yaml
# Faster R-CNN v2 (torchvision >= 0.14)

architecture: "fasterrcnn_resnet50_fpn_v2"
pretrained_weights: "COCO_V1"

backbone:
  name: "resnet50"
  trainable_layers: 3

rpn:
  # Anchor nhỏ hơn để bắt biển báo nhỏ < 32px
  anchor_sizes:  [[8], [16], [32], [64], [128]]
  aspect_ratios: [[0.5, 1.0, 2.0], [0.5, 1.0, 2.0], [0.5, 1.0, 2.0],
                  [0.5, 1.0, 2.0], [0.5, 1.0, 2.0]]

transform:
  min_size: 800
  max_size: 1333

