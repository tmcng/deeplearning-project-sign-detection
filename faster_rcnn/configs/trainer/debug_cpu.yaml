# configs/trainer/debug_cpu.yaml — CPU dry-run, 1 batch

optimizer:
  name: "sgd"
  lr: 0.005
  momentum: 0.9
  weight_decay: 0.0005

lr_scheduler:
  name: "multistep"
  milestones: [1]
  gamma: 0.1

num_epochs: 1
batch_size: 2
eval_interval: 1
mixed_precision: false

gradient_clip:
  enabled: false
  max_norm: 1.0

save_best: false
dry_run: true
num_workers: 0   # workers=0 tránh lỗi multiprocessing trên CPU

