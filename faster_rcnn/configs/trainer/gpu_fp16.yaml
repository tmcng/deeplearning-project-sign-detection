# configs/trainer/gpu_fp16.yaml — GPU, AMP FP16

optimizer:
  name: "sgd"
  lr: 0.0025   # Điều chỉnh về 0.0025 để fine-tune backbone an toàn
  momentum: 0.9
  weight_decay: 0.0005

lr_scheduler:
  name: "multistep"
  milestones: [20, 26]   # Phù hợp với 30 epochs
  gamma: 0.1

num_epochs: 30
batch_size: 8   # AMP cho phép batch 8 trên GPU T4 (16GB)
eval_interval: 1
mixed_precision: true

gradient_clip:
  enabled: true
  max_norm: 1.0   # AMP dễ explode → clip an toàn

save_best: true

